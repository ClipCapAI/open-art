name: Bug report / 问题反馈
description: 报告 open-art 中的错误、异常或与预期不符的行为。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索[已有 Issues](https://github.com/ClipCapAI/open-art/issues?q=is%3Aissue)；请勿上传 API Key 等敏感信息。可使用中文或英文填写。
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: 发生了什么？你原本期望什么结果？
      placeholder: 例如：生成任务显示完成，但画布中没有出现图片；预期是生成结果出现在对应节点中。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: 简单说明操作过程；偶发问题填写出现前的操作即可。
      placeholder: |
        1. 打开项目和画布
        2. 执行……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional information / 补充信息
      description: 可提供版本、系统、服务商与模型、截图或错误日志。支持拖入图片或附件，请先移除敏感信息。
    validations:
      required: false
