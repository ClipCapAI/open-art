name: Bug report
description: Report an error or unexpected behavior in open-art.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search [existing issues](https://github.com/ClipCapAI/open-art/issues?q=is%3Aissue). Do not include API keys or other sensitive information.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what happened and what you expected instead.
      placeholder: "Example: A generation task completes, but no image appears in its canvas node. I expected the generated image to appear in that node."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that led to the problem. For intermittent issues, describe what you were doing before it happened.
      placeholder: |
        1. Open a project and canvas.
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional information
      description: Optionally share your app version, operating system, provider and model, screenshots, or error logs. Drag and drop images or attachments here after removing sensitive information.
    validations:
      required: false
