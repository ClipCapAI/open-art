name: Feature request
description: Suggest a new feature or an improvement to the creative workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search [existing issues](https://github.com/ClipCapAI/open-art/issues?q=is%3Aissue). Do not include API keys or other sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you want to accomplish and what makes it difficult today.
      placeholder: "Example: I want to generate several image nodes with the same model, but currently have to submit each task separately."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested improvement
      description: Describe the behavior or outcome you would like. A technical implementation plan is not required.
      placeholder: "Example: Select multiple image nodes and submit their generation tasks in one action."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional information
      description: Optionally add screenshots, examples from other products, or related links. Drag and drop images or attachments here after removing sensitive information.
    validations:
      required: false
